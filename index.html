<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Points Cup</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: url("Background-castle.png") center center / cover no-repeat fixed;
    color: #f8f1df;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 24px 30px;
}

/* Match the centred, cover-sized background so the painted candle stays aligned. */
.candle-scene {
    position: fixed;
    left: 50%;
    top: 50%;
    width: max(100vw, 177.6833vh);
    aspect-ratio: 1672 / 941;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1;
}

.far-left-candle {
    position: absolute;
    left: 2.04%;
    top: 42.65%;
    width: 4%;
    height: 7%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.far-left-candle-glow {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 166, 65, 0.25) 0%, rgba(243, 113, 32, 0.11) 38%, transparent 72%);
    filter: blur(9px);
    animation: candleGlow 2.71s ease-in-out infinite;
}

.far-left-candle-flame {
    position: absolute;
    left: 50%;
    top: 78%;
    width: 23%;
    height: 66.7%;
    transform: translate(-50%, -100%);
    animation: candleBrightness 1.17s ease-in-out infinite;
}

.far-left-candle-flame::before,
.far-left-candle-flame::after {
    content: "";
    position: absolute;
    pointer-events: none;
}

/* Broad lower third stays anchored; overlapping rounded tongues narrow above it. */
.far-left-candle-flame::before {
    left: 0;
    bottom: 0;
    width: 100%;
    height: 70%;
    border-radius: 56% 44% 48% 52% / 76% 78% 24% 22%;
    background: radial-gradient(ellipse at 49% 65%, rgba(255, 253, 232, 0.94) 0%, rgba(255, 239, 161, 0.85) 34%, rgba(255, 213, 92, 0.54) 65%, rgba(255, 154, 48, 0.10) 79%, transparent 94%);
}

.far-left-candle-flame::after {
    left: 20.1%;
    bottom: 20%;
    width: 59.8%;
    height: 64%;
    transform-origin: 50% 100%;
    /* Preserve horizontal bend travel while enlarging the luminous geometry. */
    scale: 0.8695652174 1;
    border-radius: 62% 38% 48% 52% / 84% 82% 18% 16%;
    background: radial-gradient(ellipse at 50% 60%, rgba(255, 253, 232, 0.88), rgba(255, 239, 161, 0.64) 46%, transparent 94%);
    animation: candleShape 10.37s ease-in-out infinite;
}

.candle-tongue {
    position: absolute;
    left: 27%;
    top: 4%;
    width: 46%;
    height: 62%;
    transform-origin: 50% 100%;
    scale: 0.8695652174 1;
    animation: candleTipBend 10.37s ease-in-out infinite;
}

.candle-tongue-light {
    position: absolute;
    inset: 0;
    transform-origin: 50% 100%;
    animation: candleMicroFlicker 1.43s ease-in-out infinite;
}

.candle-tongue-light::before,
.candle-tongue-light::after {
    content: "";
    position: absolute;
    pointer-events: none;
}

.candle-tongue-light::before {
    inset: 0;
    border-radius: 68% 32% 47% 53% / 85% 78% 22% 15%;
    background: radial-gradient(ellipse at 51% 66%, rgba(255, 255, 241, 0.98) 0%, rgba(255, 244, 180, 0.86) 45%, rgba(255, 220, 106, 0.46) 71%, transparent 96%);
}

/* The soft cap overlaps the middle off-centre, producing a flowing curved tongue. */
.candle-tongue-light::after {
    left: 34%;
    top: 0;
    width: 55%;
    height: 56%;
    border-radius: 58% 42% 62% 38% / 30% 36% 70% 64%;
    background: radial-gradient(ellipse at 47% 52%, rgba(255, 255, 241, 0.97), rgba(255, 244, 180, 0.78) 48%, transparent 95%);
}
@keyframes candleShape {
    0%, 100% { transform: skewX(0deg) scale(1, 1); }
    5% { transform: skewX(0.7deg) scale(0.98, 1.06); }
    12% { transform: skewX(0.3deg) scale(1.03, 0.97); }
    18% { transform: skewX(1.2deg) scale(0.94, 1.20); }
    23% { transform: skewX(0.6deg) scale(1, 1.02); }
    32% { transform: skewX(0deg) scale(1.07, 0.91); }
    39% { transform: skewX(-0.8deg) scale(0.94, 1.24); }
    44% { transform: skewX(-0.4deg) scale(0.97, 1.09); }
    53% { transform: skewX(0.2deg) scale(1.02, 0.98); }
    61% { transform: skewX(0deg) scale(1, 1.02); }
    65% { transform: skewX(-2.4deg) scale(0.85, 1.36); }
    67% { transform: skewX(-0.8deg) scale(0.96, 1.12); }
    74% { transform: skewX(0deg) scale(1.04, 0.96); }
    82% { transform: skewX(0.9deg) scale(0.95, 1.17); }
    87% { transform: skewX(1.4deg) scale(0.92, 1.23); }
    93% { transform: skewX(0.3deg) scale(1.02, 0.99); }
}

@keyframes candleTipBend {
    0%, 100% { transform: skewX(0deg) scale(1, 1); }
    5% { transform: skewX(2deg) scale(0.98, 1.10); }
    12% { transform: skewX(1deg) scale(1.02, 0.97); }
    18% { transform: skewX(4deg) scale(0.92, 1.42); }
    23% { transform: skewX(2deg) scale(1, 1.05); }
    32% { transform: skewX(0deg) scale(1.06, 0.85); }
    39% { transform: skewX(-3deg) scale(0.93, 1.48); }
    44% { transform: skewX(-1deg) scale(0.98, 1.17); }
    53% { transform: skewX(1deg) scale(1.01, 0.98); }
    61% { transform: skewX(0deg) scale(1, 1.03); }
    65% { transform: skewX(-7deg) scale(0.84, 1.72); }
    67% { transform: skewX(-3deg) scale(0.96, 1.22); }
    74% { transform: skewX(0deg) scale(1.03, 0.96); }
    82% { transform: skewX(3deg) scale(0.96, 1.32); }
    87% { transform: skewX(5deg) scale(0.91, 1.44); }
    93% { transform: skewX(1deg) scale(1.02, 1); }
}

@keyframes candleMicroFlicker {
    0%, 100% { transform: scale(1, 1); opacity: 0.94; }
    9% { transform: scale(0.93, 0.90) skewX(1deg); opacity: 0.89; }
    17% { transform: scale(0.98, 0.98); opacity: 0.98; }
    29% { transform: scale(0.86, 0.87) skewX(-1deg); opacity: 0.92; }
    36% { transform: scale(0.95, 0.96); opacity: 0.96; }
    48% { transform: scale(1.03, 0.92) skewX(0.5deg); opacity: 0.90; }
    57% { transform: scale(0.94, 1); opacity: 0.99; }
    66% { transform: scale(0.89, 0.88) skewX(-0.5deg); opacity: 0.91; }
    79% { transform: scale(1.02, 0.97); opacity: 0.97; }
    87% { transform: scale(0.92, 0.91) skewX(1deg); opacity: 0.93; }
    94% { transform: scale(0.98, 0.99); opacity: 0.98; }
}@keyframes candleBrightness {
    0%, 100% { opacity: 0.72; }
    18% { opacity: 0.83; }
    37% { opacity: 0.64; }
    52% { opacity: 0.79; }
    73% { opacity: 0.68; }
    88% { opacity: 0.85; }
}

@keyframes candleGlow {
    0%, 100% { opacity: 0.48; }
    22% { opacity: 0.83; }
    39% { opacity: 0.54; }
    61% { opacity: 0.96; }
    83% { opacity: 0.58; }
}

/* Environmental lights share image coordinates; the approved master is untouched. */
.environment-lights { z-index: 0; }
.env-candle {
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--h);
    --motion: 1;
}
.env-candle .far-left-candle-flame {
    animation-duration: var(--brightness);
    animation-delay: var(--brightness-phase);
    opacity: var(--strength);
}
.env-candle .far-left-candle-flame::before { opacity: var(--strength); }
.env-candle .far-left-candle-flame::after {
    opacity: var(--strength);
    animation: envCore var(--long) ease-in-out var(--phase) infinite;
}
.env-candle .candle-tongue {
    opacity: var(--strength);
    animation: var(--bend) var(--long) ease-in-out var(--phase) infinite;
}
.env-candle .candle-tongue-light {
    animation-duration: var(--micro);
    animation-delay: var(--micro-phase);
}
.env-candle .far-left-candle-glow {
    opacity: var(--glow-strength);
    background: radial-gradient(circle, rgba(255,166,65,0.15), rgba(243,113,32,0.055) 38%, transparent 72%);
    animation: envGlow var(--glow) ease-in-out var(--glow-phase) infinite;
}
@keyframes envCore {
    0%,100% { transform: skewX(0deg) scale(1,1); }
    11% { transform: skewX(calc(var(--motion) * 0.6deg)) scale(0.98,1.04); }
    26% { transform: skewX(0deg) scale(1.02,0.97); }
    43% { transform: skewX(calc(var(--motion) * -1deg)) scale(0.96,1.10); }
    57% { transform: skewX(0deg) scale(1,1); }
    68% { transform: skewX(calc(var(--motion) * 1.2deg)) scale(0.94,1.15); }
    74% { transform: skewX(0deg) scale(1.02,0.98); }
    91% { transform: skewX(calc(var(--motion) * -0.5deg)) scale(0.98,1.05); }
}
@keyframes envGlow {
    0%,100% { opacity: calc(var(--glow-strength) * 0.48); }
    13% { opacity: calc(var(--glow-strength) * 0.62); }
    37% { opacity: calc(var(--glow-strength) * 0.44); }
    58% { opacity: calc(var(--glow-strength) * 0.73); }
    79% { opacity: calc(var(--glow-strength) * 0.55); }
    92% { opacity: calc(var(--glow-strength) * 0.61); }
}
@keyframes envLeft {
    0% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    9% { transform: skewX(calc(var(--motion) * 1deg)) scale(0.97,calc(1 + var(--motion) * 0.09000000000000008)); }
    21% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.02,calc(1 + var(--motion) * -0.06000000000000005)); }
    34% { transform: skewX(calc(var(--motion) * 3deg)) scale(0.94,calc(1 + var(--motion) * 0.22999999999999998)); }
    40% { transform: skewX(calc(var(--motion) * 2deg)) scale(0.96,calc(1 + var(--motion) * 0.1399999999999999)); }
    55% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    63% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.03,calc(1 + var(--motion) * -0.030000000000000027)); }
    71% { transform: skewX(calc(var(--motion) * 5deg)) scale(0.86,calc(1 + var(--motion) * 0.52)); }
    76% { transform: skewX(calc(var(--motion) * 1deg)) scale(0.96,calc(1 + var(--motion) * 0.08000000000000007)); }
    89% { transform: skewX(calc(var(--motion) * -1deg)) scale(0.98,calc(1 + var(--motion) * 0.15999999999999992)); }
    100% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
}
@keyframes envRight {
    0% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    7% { transform: skewX(calc(var(--motion) * -1deg)) scale(0.98,calc(1 + var(--motion) * 0.050000000000000044)); }
    18% { transform: skewX(calc(var(--motion) * -2deg)) scale(0.96,calc(1 + var(--motion) * 0.1299999999999999)); }
    33% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.04,calc(1 + var(--motion) * -0.07999999999999996)); }
    48% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    54% { transform: skewX(calc(var(--motion) * -5deg)) scale(0.87,calc(1 + var(--motion) * 0.5)); }
    59% { transform: skewX(calc(var(--motion) * -2deg)) scale(0.96,calc(1 + var(--motion) * 0.1499999999999999)); }
    73% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    86% { transform: skewX(calc(var(--motion) * 1deg)) scale(0.95,calc(1 + var(--motion) * 0.21999999999999997)); }
    93% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.02,calc(1 + var(--motion) * -0.030000000000000027)); }
    100% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
}
@keyframes envVertical {
    0% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    12% { transform: skewX(calc(var(--motion) * 0.4deg)) scale(0.97,calc(1 + var(--motion) * 0.1200000000000001)); }
    20% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.03,calc(1 + var(--motion) * -0.08999999999999997)); }
    37% { transform: skewX(calc(var(--motion) * -0.5deg)) scale(0.93,calc(1 + var(--motion) * 0.31000000000000005)); }
    45% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    61% { transform: skewX(calc(var(--motion) * 0deg)) scale(0.96,calc(1 + var(--motion) * 0.15999999999999992)); }
    69% { transform: skewX(calc(var(--motion) * 0.6deg)) scale(0.9,calc(1 + var(--motion) * 0.3999999999999999)); }
    74% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.02,calc(1 + var(--motion) * -0.030000000000000027)); }
    88% { transform: skewX(calc(var(--motion) * -0.3deg)) scale(0.98,calc(1 + var(--motion) * 0.08000000000000007)); }
    100% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
}
@keyframes envLick {
    0% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    8% { transform: skewX(calc(var(--motion) * 1deg)) scale(0.98,calc(1 + var(--motion) * 0.08000000000000007)); }
    22% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.03,calc(1 + var(--motion) * -0.06999999999999995)); }
    35% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    47% { transform: skewX(calc(var(--motion) * -2deg)) scale(0.93,calc(1 + var(--motion) * 0.33000000000000007)); }
    52% { transform: skewX(calc(var(--motion) * -1deg)) scale(0.96,calc(1 + var(--motion) * 0.19999999999999996)); }
    64% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
    79% { transform: skewX(calc(var(--motion) * 4deg)) scale(0.85,calc(1 + var(--motion) * 0.6399999999999999)); }
    83% { transform: skewX(calc(var(--motion) * 1deg)) scale(0.95,calc(1 + var(--motion) * 0.18999999999999995)); }
    94% { transform: skewX(calc(var(--motion) * 0deg)) scale(1.03,calc(1 + var(--motion) * -0.050000000000000044)); }
    100% { transform: skewX(calc(var(--motion) * 0deg)) scale(1,calc(1 + var(--motion) * 0)); }
}

/* Lantern flames stay crisp; only the confined glass illumination is softened. */
.env-lantern {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--w);
    height: var(--h);
    transform: translate(-50%,-50%);
    pointer-events: none;
}
.env-lantern::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 30%;
    background: radial-gradient(ellipse at 50% 48%, rgba(255,235,169,0.13), rgba(255,181,76,0.055) 43%, transparent 76%);
    filter: blur(2px);
    animation: var(--glass-pattern) var(--glow) ease-in-out var(--phase) infinite;
}
.lantern-flame {
    position: absolute;
    left: 50%;
    top: var(--flame-y);
    width: var(--flame-w);
    height: var(--flame-h);
    transform: translate(-50%,-100%);
    opacity: 0.70;
    pointer-events: none;
}
.lantern-flame::before,
.lantern-flame::after {
    content: "";
    position: absolute;
    pointer-events: none;
}
.lantern-flame::before {
    left: 0;
    bottom: 0;
    width: 100%;
    height: 75%;
    border-radius: 56% 44% 48% 52% / 78% 76% 24% 22%;
    background: radial-gradient(ellipse at 50% 62%, rgba(255,255,238,0.88), rgba(255,242,177,0.68) 45%, transparent 95%);
}
.lantern-flame::after {
    left: 32%;
    top: 0;
    width: 36%;
    height: 76%;
    transform-origin: 50% 100%;
    border-radius: 64% 36% 46% 54% / 42% 48% 58% 52%;
    background: radial-gradient(ellipse at 50% 55%, rgba(255,255,241,0.96), rgba(255,243,184,0.75) 48%, transparent 95%);
    animation: var(--flame-pattern) var(--flame-time) ease-in-out var(--flame-phase) infinite;
}
@keyframes lanternFlameLeft {
    0% { transform: skewX(0deg) scale(1,1); opacity: 0.94; }
    11% { transform: skewX(1deg) scale(1,0.89); opacity: 0.88; }
    26% { transform: skewX(0deg) scale(1,1.03); opacity: 0.97; }
    39% { transform: skewX(2deg) scale(1,0.95); opacity: 0.93; }
    47% { transform: skewX(1deg) scale(1,0.87); opacity: 0.9; }
    66% { transform: skewX(0deg) scale(1,0.98); opacity: 0.96; }
    79% { transform: skewX(-1deg) scale(1,1.06); opacity: 0.94; }
    91% { transform: skewX(0deg) scale(1,0.94); opacity: 0.91; }
    100% { transform: skewX(0deg) scale(1,1); opacity: 0.94; }
}
@keyframes lanternFlameRight {
    0% { transform: skewX(0deg) scale(1,0.97); opacity: 0.93; }

    58% { transform: skewX(0deg) scale(1,1.06); opacity: 0.93; }
    67% { transform: skewX(1deg) scale(1,0.88); opacity: 0.89; }
    82% { transform: skewX(0deg) scale(1,0.99); opacity: 0.96; }

@keyframes lanternGlassLeft {

h1 {
    font-family: "Felix Titling", "Palatino Linotype", "Book Antiqua", Georgia, serif;
    font-size: clamp(34px, 3.2vw, 46px);
    font-weight: 400;
    margin: 8px 0 25px;
    letter-spacing: 0.085em;
    text-align: center;
    color: #c49a54;
    background: linear-gradient(180deg, #fff0bb 0%, #e6c477 25%, #be8c42 56%, #785025 82%, #a97637 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 -1px 0 rgba(255, 239, 188, 0.35), 1px 2px 0 rgba(54, 33, 14, 0.9), 2px 3px 2px rgba(23, 14, 8, 0.55);
}

.container {
    position: relative;
    width: 100%;
    height: 560px;
    flex: none;
}

.child {
    position: absolute;
    top: 60px;
    text-align: center;
    width: 360px;
    transform: translateX(-50%);
}

.child.ruby { left: calc(31% + 20px); }
.child.green { left: calc(69% - 20px); }

.score {
    position: relative;
    z-index: 24;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 196px;
    height: 62px;
    margin: 0 auto 10px;
    padding-bottom: 12px;
    border: 2px solid #6a492b;
    border-radius: 25px 25px 12px 12px / 25px 25px 12px 12px;
    background:
        linear-gradient(180deg, #ddbd80 0%, #8a6338 23%, #473120 62%, #b78d52 86%, #50351f 100%);
    box-shadow: inset 0 2px 1px rgba(255,231,173,0.50), inset 0 -2px 2px rgba(36,22,12,0.68), 0 3px 4px rgba(0,0,0,0.55);
    font-family: "Palatino Linotype", "Book Antiqua", Garamond, Georgia, serif;
    font-size: 46px;
    font-weight: bold;
    color: #cda15d;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    -webkit-text-stroke: 0.25px #e6c27d;
    text-shadow:
        -1px -1px 0 #f3d89c,
        1px 1px 0 #7b522b,
        2px 2px 0 #4b301c,
        2px 3px 1px rgba(0,0,0,0.65);
}

.score-number,
.crystals,
.upper-crystals {
    transition: opacity 200ms ease;
}

.scores-loading .score-number,
.scores-loading .crystals,
.scores-loading .upper-crystals {
    opacity: 0;
}

.score::before {
    content: "";
    position: absolute;
    z-index: -1;

/* HOURGLASS */

/* =========================================================
   MAGICAL HOURGLASS
   ========================================================= */

.hourglass {
    position: relative;
    width: 190px;
    height: 280px;
    margin: 24px auto 12px;
    zoom: 1.25;
    --vessel-shape: path("M 0 0 H 154 C 154 28 146 58 117 86 C 105 99 100 110 99 123 C 98 130 98 136 99 142 C 100 152 105 164 117 178 C 145 213 154 239 154 266 H 0 C 0 239 9 213 37 178 C 49 164 54 152 55 142 C 56 136 56 130 55 123 C 54 110 49 99 37 86 C 8 58 0 28 0 0 Z");
}

.hourglass::after {
    content: "";
    position: absolute;
    z-index: 0;

    right: 4px;

/* ---------------------------------------------------------
   GLASS BODY
   --------------------------------------------------------- */

.glass-body {
    position: absolute;
    left: 18px;
    right: 18px;
    top: 7px;
    bottom: 7px;
    z-index: 2;

    background:
        radial-gradient(ellipse 22px 100px at 10% 18%, rgba(221,239,251,0.10), transparent 85%),
        radial-gradient(ellipse 22px 108px at 90% 82%, rgba(204,227,244,0.09), transparent 85%),

            90deg,
            rgba(204,230,247,0.18) 0%,
            rgba(116,154,183,0.06) 6%,
            rgba(224,243,255,0.012) 20%,
            transparent 50%,

            rgba(116,154,183,0.06) 94%,

}

.ruby .glass-body { background-color: rgba(43, 19, 35, 0.07); }
.green .glass-body { background-color: rgba(13, 43, 46, 0.07); }

/* Rear glass catches the surroundings while its centre stays clear. */
.glass-body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(90deg, rgba(234,247,255,0.22), transparent 7%, transparent 93%, rgba(234,247,255,0.18)),

}

/* Refraction darkens the throat without clouding the gem chambers. */
.glass-body::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        radial-gradient(ellipse 28px 62px at 50% 50%, rgba(15,27,43,0.09), transparent 80%),

/* The restrained front reflection lies over the live gems. */
.glass-sheen {

    bottom: 7px;

.glass-sheen::before,

/* ---------------------------------------------------------
   NECK
   --------------------------------------------------------- */

.neck {
    position: absolute;
    left: 50%;
    top: 109px;
    transform: translateX(-50%);
    width: 46px;
    height: 62px;
    z-index: 8;
    pointer-events: none;
    background: transparent;
    border: 0;
    box-shadow: none;
}


/* ---------------------------------------------------------
   CRYSTAL CONTAINERS
   --------------------------------------------------------- */

.crystals {
    position: absolute;

    left: 18px;
    right: 18px;
    bottom: 8px;

    height: 116px;

    overflow: hidden;
    z-index: 4;
}

.upper-crystals {
    position: absolute;

    left: 18px;
    right: 18px;
    top: 8px;

    height: 195px;

    overflow: hidden;
    z-index: 5;
}

/* ---------------------------------------------------------
   PERMANENT GEMS
   --------------------------------------------------------- */

.crystal {
    position: absolute;

    width: 10px;
    height: 14px;

    clip-path: polygon(
        50% 0%,
        100% 28%,
        82% 100%,
        18% 100%,
        0% 28%
    );

    animation: crystalGlow 2.2s ease-in-out infinite;

    filter:
        drop-shadow(0 0 2px currentColor)
        drop-shadow(0 0 5px currentColor);

    overflow: hidden;
}

/* Main upper facet */
.crystal::before {
    content: "";

    position: absolute;

    left: 1px;
    top: 1px;

    width: 8px;
    height: 7px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.92),
            rgba(255,255,255,0.38) 48%,
            rgba(255,255,255,0.05) 100%
        );

    clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
    );

    opacity: 0.82;
}

/* Lower/darker facet + travelling glint */
.crystal::after {
    content: "";

    position: absolute;

    left: 1px;
    top: 6px;

    width: 8px;
    height: 8px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.12),
            rgba(0,0,0,0.38)
        );

    clip-path: polygon(
        50% 0%,
        100% 20%,
        72% 100%,
        28% 100%,
        0% 20%
    );

    opacity: 0.65;
}

/* ---------------------------------------------------------
   RUBY
   --------------------------------------------------------- */

.ruby .crystal {
    background:
        linear-gradient(
            135deg,
            #fff0f3 0%,
            #ff8da0 15%,
            #ff3154 32%,
            #c4002d 58%,
            #700018 82%,
            #39000c 100%
        );

    color: #ff3155;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,0.9),
        inset -2px -3px 3px rgba(50,0,12,0.8);
}

/* ---------------------------------------------------------
   EMERALD
   --------------------------------------------------------- */

.green .crystal {
    background:
        linear-gradient(
            135deg,
            #effff2 0%,
            #9dffad 15%,
            #42f76a 32%,
            #13b83d 58%,
            #05621d 82%,
            #02350f 100%
        );

    color: #28e95b;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,0.9),
        inset -2px -3px 3px rgba(0,50,15,0.8);
}

/* Rendered permanent gems; the CSS crystal rules above remain available. */
.crystal.sprite-permanent {
    width: 13px;
    height: 15px;
    background: var(--gem-sprite) center top / 13px auto no-repeat;
    clip-path: none;
    animation: none;
    filter: none;
    box-shadow: none;
    overflow: visible;
}

.crystal.sprite-permanent::before,
.crystal.sprite-permanent::after {
    content: none;
}

/* ---------------------------------------------------------
   GEM GLOW
   --------------------------------------------------------- */

@keyframes crystalGlow {

    0%, 100% {
        filter:
            drop-shadow(0 0 2px currentColor)
            drop-shadow(0 0 5px currentColor);
    }

    50% {
        filter:
            drop-shadow(0 0 4px currentColor)
            drop-shadow(0 0 9px currentColor)
            drop-shadow(0 0 13px rgba(255,255,255,0.25));
    }
}

/* ---------------------------------------------------------
   FALLING GEM
   --------------------------------------------------------- */

.falling-crystal {
    position: absolute;

    left: calc(50% + var(--fall-x, 0px));
    top: 20px;

    width: 13px;
    height: 18px;

    transform: translateX(-50%);

    clip-path: polygon(
        50% 0%,
        100% 25%,
        82% 100%,
        18% 100%,
        0% 25%
    );

    animation: fall 1.1s ease-in forwards;

    z-index: 20;

    filter:
        drop-shadow(0 0 4px currentColor)
        drop-shadow(0 0 10px currentColor);
}

/* bright upper facet */
.falling-crystal::before {
    content: "";

    position: absolute;

    left: 1px;
    top: 1px;

    width: 11px;
    height: 8px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.98),
            rgba(255,255,255,0.45),
            rgba(255,255,255,0.05)
        );

    clip-path: polygon(
        50% 0%,
        100% 100%,
        0% 100%
    );

    opacity: 0.82;
}

/* darker lower facet */
.falling-crystal::after {
    content: "";

    position: absolute;

    left: 2px;
    top: 7px;

    width: 9px;
    height: 10px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.10),
            rgba(0,0,0,0.40)
        );

    clip-path: polygon(
        50% 0%,
        100% 35%,
        70% 100%,
        30% 100%,
        0% 35%
    );
}

/* Ruby falling gem */
.ruby .falling-crystal {
    background:
        linear-gradient(
            135deg,
            #fff0f3 0%,
            #ff8da0 15%,
            #ff3154 32%,
            #c4002d 58%,
            #700018 82%,
            #39000c 100%
        );

    color: #ff3155;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,0.95),
        inset -2px -3px 3px rgba(50,0,12,0.8);
}

/* Emerald falling gem */
.green .falling-crystal {
    background:
        linear-gradient(
            135deg,
            #effff2 0%,
            #9dffad 15%,
            #42f76a 32%,
            #13b83d 58%,
            #05621d 82%,
            #02350f 100%
        );

    color: #28e95b;

    box-shadow:
        inset 1px 1px 2px rgba(255,255,255,0.95),
        inset -2px -3px 3px rgba(0,50,15,0.8);
}

/* Rendered artwork for falling gems only; the 13×18px animation box is unchanged. */
.falling-crystal.sprite-falling {
    background: var(--gem-sprite) center top / 13px auto no-repeat;
    clip-path: none;
    box-shadow: none;
    filter: none;
}

.falling-crystal.sprite-falling::before,
.falling-crystal.sprite-falling::after {
    content: none;
}

/* ---------------------------------------------------------
   FALL ANIMATION
   --------------------------------------------------------- */

@keyframes fall {

    0% {
        transform:
            translate(-50%, 0)
            rotate(0deg)
            scale(0.6);

        opacity: 0;
    }

    15% {
        opacity: 1;

        transform:
            translate(-50%, 10px)
            rotate(45deg)
            scale(1);
    }

    70% {
        transform:
            translate(
                -50%,
                calc(var(--fall-distance) - 8px)
            )
            rotate(220deg)
            scale(1);

        opacity: 1;
    }

    82% {
        transform:
            translate(
                -50%,
                var(--fall-distance)
            )
            rotate(270deg)
            scale(1);

        opacity: 1;
    }

    88% {
        transform:
            translate(
                -50%,
                calc(var(--fall-distance) - 2px)
            )
            rotate(285deg)
            scale(1.06);

        opacity: 1;
    }

    94% {
        transform:
            translate(
                -50%,
                var(--fall-distance)
            )
            rotate(300deg)
            scale(0.98);

        opacity: 0.8;
    }

    100% {
        transform:
            translate(
                -50%,
                var(--fall-distance)
            )
            rotate(315deg)
            scale(0);

        opacity: 0;
    }
}

/* Lightning lights the sky beyond the central gothic window. */
.lightning-flash {
    position: fixed;
    inset: 0;
    z-index: 30;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0;
    animation: sheetLightning 1100ms linear forwards;
}

/* Two sky-lit panes leave the central stone mullion unlit. */
.lightning-flash::before,
.lightning-flash::after {
    content: "";
    position: absolute;
    top: 21%;
    width: 5.2%;
    height: 40%;
    background: radial-gradient(ellipse at 50% 42%, rgba(255,245,248,0.96), rgba(232,190,205,0.40) 48%, rgba(184,207,245,0.18) 70%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 85% 72% at 50% 48%, #000 25%, transparent 100%);
    mask-image: radial-gradient(ellipse 85% 72% at 50% 48%, #000 25%, transparent 100%);
}

.lightning-flash::before { left: 44.3%; }
.lightning-flash::after { left: 50.5%; }

.lightning-bolt {
    position: absolute;
    left: 46.7%;
    top: 15%;
    width: 2%;
    height: 19.5%;
    overflow: visible;
    fill: none;
    stroke: #fff7f8;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 2px #ffffff) drop-shadow(0 0 5px #e37a94);
    opacity: 0;
    animation: boltStrike 1100ms step-end forwards;
}

@keyframes boltStrike {
    0%, 5% { opacity: 1; }
    6%, 17% { opacity: 0; }
    18%, 23% { opacity: 0.88; }
    24%, 100% { opacity: 0; }
}

/* A restrained reflection links the outdoor flash to the affected hourglass. */
.lightning-reflection {
    position: absolute;
    top: -45px;
    left: 50%;
    width: 520px;
    height: 600px;
    transform: translateX(-50%);
    z-index: 30;
    pointer-events: none;
    background:
        radial-gradient(ellipse 28% 35% at 50% 46%, rgba(225,240,255,0.24), transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 55% 60% at 50% 48%, #000 18%, transparent 100%);
    mask-image: radial-gradient(ellipse 55% 60% at 50% 48%, #000 18%, transparent 100%);
    mix-blend-mode: screen;
    opacity: 0;
    animation: sheetLightning 1100ms linear forwards;
}

@keyframes sheetLightning {
    0% { opacity: 0.82; }
    8% { opacity: 0.10; }
    13%, 18% { opacity: 0.02; }
    23% { opacity: 0.42; }
    31% { opacity: 0.05; }
    40% { opacity: 0.13; }
    49% { opacity: 0.04; }
    65% { opacity: 0.06; }
    100% { opacity: 0; }
}

.crystal.shattering {
    animation: crystalShatter 350ms ease-out var(--shatter-delay, 0ms) forwards;
}

@keyframes crystalShatter {
    0% { opacity: 1; filter: brightness(1.8) drop-shadow(0 0 7px currentColor); }
    18% { opacity: 1; filter: brightness(2.5) drop-shadow(0 0 10px currentColor); }
    35%, 100% { opacity: 0; transform: scale(0.45) rotate(30deg); }
}

.shatter-fragment {
    position: absolute;
    z-index: 19;
    width: var(--shard-size);
    height: var(--shard-size);
    pointer-events: none;
    clip-path: polygon(45% 0, 100% 35%, 72% 100%, 0 72%);
    box-shadow: 0 0 5px currentColor;
    opacity: 0;
    animation: disperseShard 370ms ease-out var(--shatter-delay, 0ms) forwards;
}

.ruby .shatter-fragment {
    color: #ff3155;
    background: linear-gradient(135deg, #ffd9df, #ec3558 40%, #810018);
}

.green .shatter-fragment {
    color: #28e95b;
    background: linear-gradient(135deg, #e1ffe7, #39d65d 40%, #075b23);
}

@keyframes disperseShard {
    0%, 15% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(0.5); }
    25% { opacity: 1; transform: translate(0, -2px) rotate(20deg) scale(1); }
    100% { opacity: 0; transform: translate(var(--shard-x), var(--shard-y)) rotate(var(--shard-turn)) scale(0.3); }
}

@media (max-width: 960px) {
    body { padding: 18px 16px 30px; }
    h1 { margin-bottom: 18px; }
    .container { display: flex; flex-direction: column; align-items: center; gap: 30px; height: auto; }
    .child { position: relative; top: auto; left: auto !important; width: min(100%, 360px); transform: none; }
    .hourglass { zoom: 1.08; margin-bottom: 12px; }
}

.ruby .gem-land {

}

.green .gem-land {

}

@keyframes rubyLandingPulse {

    0%, 100% {

    35% {

            drop-shadow(0 0 14px rgba(255,80,110,0.5))

@keyframes greenLandingPulse {

let thunderBuffer = null;
let activeThunder = null;

async function preloadThunder() {
    try {
        const Decoder = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!Decoder) return;
        const decoder = new Decoder(2, 1, 48000);
        const bytes = location.protocol === "file:"
            ? Uint8Array.from(atob(THUNDER_LOCAL_DATA), character => character.charCodeAt(0)).buffer
            : await fetch(THUNDER_URL).then(response => {
                if (!response.ok) throw new Error("Thunder sample unavailable");
                return response.arrayBuffer();
            });
        thunderBuffer = await decoder.decodeAudioData(bytes);
    } catch (error) {
        console.warn("Thunder audio unavailable", error);
    }
}
const thunderReady = preloadThunder();

function playThunder() {
    tracePointsCupAudio("THUNDER AUDIO REQUESTED");
    const context = gemAudioContext;
    if (!context || context.state !== "running" || !thunderBuffer) return;
    try {
        const now = context.currentTime;
        if (activeThunder) {
            const previous = activeThunder;
            previous.gain.gain.cancelScheduledValues(now);
            previous.gain.gain.setValueAtTime(previous.gain.gain.value, now);
            previous.gain.gain.linearRampToValueAtTime(0, now + 0.025);
            try { previous.source.stop(now + 0.03); } catch (_) {}
            activeThunder = null;
        }
        const source = context.createBufferSource();
        const gain = context.createGain();
        source.buffer = thunderBuffer;
        gain.gain.value = THUNDER_GAIN;
        source.connect(gain);
        gain.connect(context.destination);
        const instance = { source, gain };
        activeThunder = instance;
        source.onended = () => {
            if (activeThunder === instance) activeThunder = null;
            source.disconnect();
            gain.disconnect();
        };
        source.start(now, THUNDER_START_OFFSET);
        tracePointsCupAudio("THUNDER SAMPLE STARTED");
    } catch (error) {
        console.warn("Thunder playback unavailable", error);
    }
}


// A/B comparison: "synth" = procedural sound; "sample" = unlayered real clinks.
const GEM_SOUND_MODE = "sample";
const GEM_SAMPLE_URLS = [
    "assets/audio/gem wine clink 1.wav"
];
const GEM_SAMPLE_GAIN = 0.04;
const GEM_SHIMMER_LEVEL = 0; // Temporarily hear only the source recordings.
let gemClinkSamples = [];
let lastGemClink = null;
let gemSampleBus = null;
const overlappingGemSamples = new Set();

async function preloadGemSample() {
    try {
        const Decoder = window.OfflineAudioContext || window.webkitOfflineAudioContext;
        if (!Decoder) return;
        const decoder = new Decoder(2, 1, 48000);
        const results = await Promise.allSettled(GEM_SAMPLE_URLS.map(async (url, index) => {
            const bytes = location.protocol === "file:"
                ? Uint8Array.from(atob(GEM_SAMPLE_LOCAL_DATA[index]), character => character.charCodeAt(0)).buffer
                : await fetch(url).then(response => {
                    if (!response.ok) throw new Error("Clink sample unavailable");
                    return response.arrayBuffer();
                });
            const buffer = await decoder.decodeAudioData(bytes);
            let peak = 0;
            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                for (const sample of buffer.getChannelData(channel)) peak = Math.max(peak, Math.abs(sample));
            }
            if (!peak) throw new Error("Clink sample is silent");
            // Keep one millisecond before the attack; skip recording/encoder padding.
            const threshold = Math.max(0.0005, peak * 0.002);
            let firstFrame = buffer.length;
            for (let channel = 0; channel < buffer.numberOfChannels; channel++) {
                const samples = buffer.getChannelData(channel);
                for (let i = 0; i < firstFrame; i++) {
                    if (Math.abs(samples[i]) >= threshold) { firstFrame = i; break; }
                }
            }
            return {
                index, buffer,
                offset: Math.max(0, firstFrame / buffer.sampleRate - 0.001),
                // The offset removes leading recording padding, preserving impact timing.
            };
        }));
        gemClinkSamples = results.filter(result => result.status === "fulfilled").map(result => result.value);
    } catch (_) {
        gemClinkSamples = [];
    }
}

function ensureAudio() {
    if (gemAudioUnavailable) return;
    try {
        if (!gemAudioContext) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) {
                gemAudioUnavailable = true;
                return;
            }
            gemAudioContext = new AudioContextClass();
            gemAudioContext.addEventListener("statechange", updateSoundControl);
            gemAudioContext.addEventListener("statechange", () => tracePointsCupAudio("AUDIO CONTEXT STATE CHANGED"));
            tracePointsCupAudio("AUDIO CONTEXT CREATED");
        }
        if (gemAudioContext.state === "suspended") {
            return gemAudioContext.resume().then(updateSoundControl).catch(updateSoundControl);
        }
        updateSoundControl();
    } catch (_) {
        gemAudioUnavailable = true;
        updateSoundControl();
    }
}

const enableSoundButton = document.getElementById("enableSound");
function updateSoundControl() {
    enableSoundButton.hidden = gemAudioContext?.state === "running" &&
        gemClinkSamples.length > 0 && !!thunderBuffer;
}
enableSoundButton.addEventListener("click", async () => {
    const resumed = ensureAudio(); // Resume inside the genuine click gesture.
    if (resumed) await resumed;
    await Promise.all([gemSampleReady, thunderReady]);
    updateSoundControl();
});

function unlockGemAudio(event) {
    if (event.isTrusted) ensureAudio();
}
document.addEventListener("pointerdown", unlockGemAudio, { capture: true, passive: true });
document.addEventListener("keydown", unlockGemAudio, { capture: true });
document.addEventListener("click", unlockGemAudio, { capture: true, passive: true });

function playSynthesizedGemLandingSound(child, scheduledTime, level = 1, shimmerOnly = false) {
    const context = gemAudioContext;
    if (!context || context.state !== "running") return;
    const sources = [];
    let output = null;
    let panner = null;
    try {
        // A narrow, centre-weighted pentatonic range avoids a keyboard-like sequence.
        const choices = child === "charlie" ? [1, 2, 2, 2, 3] : [0, 1, 1, 1, 2];
        const pitchIndex = choices[Math.floor(Math.random() * choices.length)];
        const pitch = gemChimePitches[pitchIndex] * (0.985 + Math.random() * 0.03);
        const when = Math.max(context.currentTime, scheduledTime ?? context.currentTime);
        output = context.createGain();
        output.gain.value = 0.9 * level;
        panner = typeof context.createStereoPanner === "function" ? context.createStereoPanner() : null;
        if (panner) {
            panner.pan.value = child === "rhea" ? -0.13 : 0.13;
            output.connect(panner);
            panner.connect(context.destination);
        } else {
            output.connect(context.destination);
        }
        let voicesRemaining;
        function releaseVoice(source, envelope, extraNodes = []) {
            source.onended = () => {
                source.disconnect();
                envelope.disconnect();
                extraNodes.forEach(node => node.disconnect());
                if (--voicesRemaining === 0) {
                    output.disconnect();
                    if (panner) panner.disconnect();
                }
            };
        }
        const partials = [
            { ratio: 1, volume: 0.012, decay: 0.60 },
            { ratio: 2.01, volume: 0.0055, decay: 0.40 },
            { ratio: 2.7, volume: 0.0038, decay: 0.25 },
            { ratio: 4.05, volume: 0.0016, decay: 0.18 },
            { ratio: 5.4, volume: 0.00065, decay: 0.12 },
            // Almost subliminal sparkle, separate from the five body partials.
            { ratio: 6.23, volume: 0.00045, decay: 0.075 }
        ];
        const selectedPartials = shimmerOnly ? partials.slice(1) : partials;
        voicesRemaining = selectedPartials.length + (shimmerOnly ? 0 : 1);
        for (const partial of selectedPartials) {
            const oscillator = context.createOscillator();
            const envelope = context.createGain();
            envelope.gain.value = 0;
            const decay = partial.decay * (0.9 + Math.random() * 0.2);
            const volume = partial.volume * (0.88 + Math.random() * 0.24);
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(pitch * partial.ratio, when);
            envelope.gain.setValueAtTime(0.00001, when);
            envelope.gain.exponentialRampToValueAtTime(volume, when + 0.0015);
            envelope.gain.exponentialRampToValueAtTime(0.00001, when + decay);
            envelope.gain.linearRampToValueAtTime(0, when + decay + 0.008);
            oscillator.connect(envelope);
            envelope.connect(output);
            releaseVoice(oscillator, envelope);
            sources.push(oscillator);
            oscillator.start(when);
            oscillator.stop(when + decay + 0.012);
        }

        // In hybrid mode the recording supplies the contact, so omit synthetic noise.
        if (!shimmerOnly) {
        // A tiny band-limited noise impulse supplies the physical contact "tik".
        if (!gemImpactNoiseBuffer) {
            gemImpactNoiseBuffer = context.createBuffer(1, Math.ceil(context.sampleRate * 0.016), context.sampleRate);
            const samples = gemImpactNoiseBuffer.getChannelData(0);
            for (let i = 0; i < samples.length; i++) samples[i] = (Math.random() * 2 - 1) * (1 - i / samples.length);
        }
        const impact = context.createBufferSource();
        const bandpass = context.createBiquadFilter();
        const impactEnvelope = context.createGain();
        impactEnvelope.gain.value = 0;
        impact.buffer = gemImpactNoiseBuffer;
        bandpass.type = "bandpass";
        bandpass.frequency.value = 2800 + Math.random() * 500;
        bandpass.Q.value = 0.85;
        impactEnvelope.gain.setValueAtTime(0.00001, when);
        impactEnvelope.gain.exponentialRampToValueAtTime(0.005 * (0.8 + Math.random() * 0.4), when + 0.0006);
        impactEnvelope.gain.exponentialRampToValueAtTime(0.00001, when + 0.013);
        impactEnvelope.gain.linearRampToValueAtTime(0, when + 0.016);
        impact.connect(bandpass);
        bandpass.connect(impactEnvelope);
        impactEnvelope.connect(output);
        releaseVoice(impact, impactEnvelope, [bandpass]);
        sources.push(impact);
        impact.start(when);
        impact.stop(when + 0.016);
        }

        return () => {
            // Cancel only future impacts; an already struck gem keeps its natural decay.
            if (context.currentTime >= when) return;
            sources.forEach(source => { try { source.stop(context.currentTime); } catch (_) {} });
        };
    } catch (_) {
        sources.forEach(source => { try { source.stop(); } catch (_) {} });
        if (output) output.disconnect();
        if (panner) panner.disconnect();
        // An unavailable audio device must never interrupt a falling gem.
    }
}

function chooseGemClink(when) {
    return gemClinkSamples[0];
}

function playRecordedGemImpact(child, scheduledTime) {
    const context = gemAudioContext;
    const when = Math.max(context.currentTime, scheduledTime ?? context.currentTime);
    const sample = chooseGemClink(when);
    const source = context.createBufferSource();
    const envelope = context.createGain();
    const panner = typeof context.createStereoPanner === "function" ? context.createStereoPanner() : null;
    const impact = { when, end: when + sample.buffer.duration - sample.offset, sampleIndex: sample.index };
    source.buffer = sample.buffer;
    source.playbackRate.setValueAtTime(1, when);
    envelope.gain.value = 0;
    envelope.gain.setValueAtTime(GEM_SAMPLE_GAIN, when);
    if (!gemSampleBus) {
        // A fixed gain bus preserves the recording's natural dynamics.
        gemSampleBus = context.createGain();
        gemSampleBus.gain.value = 1;
        gemSampleBus.connect(context.destination);
    }
    source.connect(envelope);
    if (panner) {
        panner.pan.value = child === "rhea" ? -0.13 : 0.13;
        envelope.connect(panner);
        panner.connect(gemSampleBus);
    } else {
        envelope.connect(gemSampleBus);
    }
    overlappingGemSamples.add(impact);
    if (!lastGemClink || when >= lastGemClink.when) lastGemClink = impact;
    source.onended = () => {
        overlappingGemSamples.delete(impact);
        source.disconnect();
        envelope.disconnect();
        if (panner) panner.disconnect();
    };
    source.start(when, sample.offset);
    tracePointsCupAudio("GEM SAMPLE STARTED", child);
    return {
        cancel: () => {
            if (context.currentTime >= when) return;
            overlappingGemSamples.delete(impact);
            try { source.stop(context.currentTime); } catch (_) {}
        }
    };
}

function playGemLandingSound(child, scheduledTime) {
    tracePointsCupAudio("GEM IMPACT AUDIO REQUESTED", child);
    if (!gemAudioContext || gemAudioContext.state !== "running") return;
    if (GEM_SOUND_MODE === "synth" || gemClinkSamples.length === 0) {
        return playSynthesizedGemLandingSound(child, scheduledTime);
    }
    try {
        const sample = playRecordedGemImpact(child, scheduledTime);
        const cancelShimmer = GEM_SHIMMER_LEVEL > 0
            ? playSynthesizedGemLandingSound(child, scheduledTime, GEM_SHIMMER_LEVEL, true)
            : null;
        return () => {
            sample.cancel();
            if (cancelShimmer) cancelShimmer();
        };
    } catch (_) {
        return playSynthesizedGemLandingSound(child, scheduledTime);
    }
}

function scheduleGemImpactSound(child, crystal, fallDuration) {
    tracePointsCupAudio("GEM IMPACT SCHEDULER REACHED", child);
    const context = gemAudioContext;
    if (!context || context.state !== "running" || !crystal.isConnected) return;
    try {
        const animation = crystal.getAnimations().find(item => item.animationName === "fall");
        if (!animation || animation.currentTime === null) return;
        // The existing visual first contacts the pile at 82%, before its bounce/fade.
        const remaining = fallDuration * 0.82 - Number(animation.currentTime);
        if (remaining <= 0) return;
        const contactTime = performance.now() + remaining;
        const timestamp = typeof context.getOutputTimestamp === "function" ? context.getOutputTimestamp() : null;
        const audioTime = timestamp && timestamp.performanceTime > 0
            ? timestamp.contextTime + (contactTime - timestamp.performanceTime) / 1000
            : context.currentTime + remaining / 1000 - (context.outputLatency || context.baseLatency || 0);
        const cancel = playGemLandingSound(child, audioTime);
        if (cancel) scheduledGemImpacts.set(crystal, cancel);
    } catch (_) {}
}

function cancelGemImpactSound(crystal) {
    const cancel = scheduledGemImpacts.get(crystal);
    if (cancel) cancel();
    scheduledGemImpacts.delete(crystal);
}

function stylePermanentCrystal(child, crystal, index) {
    const offset = child === "rhea" ? 1 : 3;
    const variant = landedSpriteVariants[child].get(index) ?? (index * 3 + offset) % 5 + 1;
    // The two outer stones beside the narrow glass curves need less tilt.
    const besideWaist = index === 44 || index === 60;
    const rotation = besideWaist ? 0 : (index * 37 + offset * 7) % 17 - 8;
    const scale = besideWaist ? 0.95 : 0.97 + ((index * 7 + offset) % 7) * 0.01;
    crystal.dataset.jitter = index === 44 ? 1.2 : (((index * 29 + offset) % 9) - 4) * 0.35;
    crystal.style.transform = `rotate(${rotation}deg) scale(${scale})`;

    if (USE_RENDERED_PERMANENT_GEMS) {
        const colour = child === "rhea" ? "ruby" : "emerald";
        crystal.classList.add("sprite-permanent");
        crystal.style.setProperty("--gem-sprite", `url("assets/gems/${colour}-${variant}.png")`);
    }
}

        processPointQueue(child);
    }
    if (source === "local") saveScore(child);
}

function triggerLightning(child) {
    playThunder();
    const area = document.getElementById(child + "Glass").closest(".child");
    document.querySelectorAll(".lightning-flash, .lightning-reflection").forEach(flash => flash.remove());
    const flash = document.createElement("div");
    flash.className = "lightning-flash";
    flash.innerHTML = '<svg class="lightning-bolt" viewBox="0 0 40 100" aria-hidden="true"><path d="M 28 3 L 17 25 L 24 27 L 11 57 L 18 58 L 8 91 M 17 43 L 31 54 L 26 65"/></svg>';
    const reflection = document.createElement("div");
    reflection.className = "lightning-reflection";
    document.body.appendChild(flash);
    area.appendChild(reflection);
    setTimeout(() => { flash.remove(); reflection.remove(); }, 1100);
}

function shatterCrystal(child, crystal) {
    const glass = document.getElementById(child + "Glass");
    const chamber = crystal.parentElement;
    const delay = Math.random() * 45;

    crystal.style.setProperty("--shatter-delay", delay + "ms");
    crystal.classList.add("shattering");

    for (let i = 0; i < 5; i++) {
        const fragment = document.createElement("div");
        fragment.className = "shatter-fragment";
        fragment.style.left =
            `${chamber.offsetLeft + crystal.offsetLeft + crystal.offsetWidth / 2}px`;
        fragment.style.top =
            `${chamber.offsetTop + crystal.offsetTop + crystal.offsetHeight / 2}px`;
        fragment.style.setProperty("--shard-size", `${3 + Math.random() * 4}px`);
        fragment.style.setProperty("--shard-x", `${Math.random() * 58 - 29}px`);
        fragment.style.setProperty("--shard-y", `${-12 - Math.random() * 34}px`);
        fragment.style.setProperty("--shard-turn", `${Math.random() * 540 - 270}deg`);
        fragment.style.setProperty("--shatter-delay", `${delay + Math.random() * 25}ms`);
        glass.appendChild(fragment);
        setTimeout(() => fragment.remove(), 440);
    }
}

function crystalSlots(count) {
    const slots = [];
    let remaining = Math.min(count, 116);

    for (const row of lowerRows) {
        if (remaining <= 0) break;
        const numberInRow = Math.min(row.count, remaining);
        const startX = (154 - (numberInRow - 1) * 11) / 2 - 4;
        for (let i = 0; i < numberInRow; i++) {
            slots.push({ chamber: "lower", x: startX + i * 11, y: row.y });
        }
        remaining -= numberInRow;
    }

    for (const row of upperRows) {
        if (remaining <= 0) break;
        const numberInRow = Math.min(row.count, remaining);
        const startX = (154 - (numberInRow - 1) * 10) / 2 - 4;
        for (let i = 0; i < numberInRow; i++) {
            slots.push({ chamber: "upper", x: startX + i * 10, y: row.y });
        }
        remaining -= numberInRow;
    }

    return slots;
}

function freezeSettlingGems(child) {
    const glass = document.getElementById(child + "Glass");
    glass.querySelectorAll(".crystal:not(.shattering)").forEach(crystal => {
        if (!crystal.style.transition) return;
        const position = getComputedStyle(crystal);
        const left = position.left;
        const top = position.top;
        crystal.style.transition = "none";
        crystal.style.left = left;
        crystal.style.top = top;
    });
}

function settleSurvivingGems(child) {
    const queue = pointQueues[child];
    const glass = document.getElementById(child + "Glass");
    const lower = document.getElementById(child + "Crystals");
    const upper = document.getElementById(child + "UpperCrystals");

    glass.querySelectorAll(".crystal.shattering").forEach(crystal => crystal.remove());
    const survivors = [
        ...lower.querySelectorAll(".crystal"),
        ...upper.querySelectorAll(".crystal")
    ];
    const slots = crystalSlots(queue.landed);

    while (survivors.length > slots.length) survivors.pop().remove();

    while (survivors.length < slots.length) {
        const slot = slots[survivors.length];
        const crystal = document.createElement("div");
        crystal.className = "crystal";
        stylePermanentCrystal(child, crystal, survivors.length);
        crystal.style.left = `${slot.x}px`;
        crystal.style.top = `${slot.y + Number(crystal.dataset.jitter)}px`;
        (slot.chamber === "lower" ? lower : upper).appendChild(crystal);
        survivors.push(crystal);
    }

    survivors.forEach(crystal => { crystal.style.transition = "none"; });
    void glass.offsetWidth;

    survivors.forEach((crystal, index) => {
        const slot = slots[index];
        const chamber = slot.chamber === "lower" ? lower : upper;
        if (crystal.parentElement !== chamber) chamber.appendChild(crystal);
        crystal.style.transition =
            `left 460ms cubic-bezier(.22,.75,.3,1) ${Math.random() * 40}ms, ` +
            `top 460ms cubic-bezier(.22,.75,.3,1) ${Math.random() * 40}ms`;
        crystal.style.left = `${slot.x}px`;
        crystal.style.top = `${slot.y + Number(crystal.dataset.jitter || 0)}px`;
    });

    queue.removalTimer = setTimeout(() => {
        queue.removalTimer = null;
        survivors.forEach(crystal => { crystal.style.transition = ""; });
        glass.querySelectorAll(".shatter-fragment").forEach(fragment => fragment.remove());
        if (queue.landed !== slots.length && queue.landed <= 116) {
            settleSurvivingGems(child);
        }
    }, 530);
}

function animatePointRemoval(child, removed) {
    const queue = pointQueues[child];
    const lower = document.getElementById(child + "Crystals");
    const upper = document.getElementById(child + "UpperCrystals");
    const gems = [
        ...lower.querySelectorAll(".crystal:not(.shattering)"),
        ...upper.querySelectorAll(".crystal:not(.shattering)")
    ];

    clearTimeout(queue.removalTimer);
    freezeSettlingGems(child);
    triggerLightning(child);
    gems.slice(-removed).reverse().forEach(crystal => shatterCrystal(child, crystal));

    queue.removalTimer = setTimeout(() => {
        settleSurvivingGems(child);
    }, 440);
}

function processPointQueue(child) {
    const queue = pointQueues[child];

    if (queue.pending <= 0) {
        queue.timer = null;
        return;
    }

    const currentPoints = queue.launched++;
    queue.pending--;
    const generation = queue.generation;

    showFallingCrystal(
        child,
        currentPoints,
        spriteVariant => {
            if (generation !== queue.generation) return false;
            if (currentPoints < 116) landedSpriteVariants[child].set(currentPoints, spriteVariant);
            queue.landed++;
            if (queue.removalTimer === null) updateDisplay(child, queue.landed);
            return true;
        }
    );

    // Launch the next gem shortly afterwards.
    queue.timer = setTimeout(() => {
        processPointQueue(child);
    }, 180);
}
function updateDisplay(child, displayPoints = points[child]) {

    document.getElementById(child + "Score").querySelector(".score-number").textContent =
        points[child];

    const lower =
        document.getElementById(child + "Crystals");

    const upper =
        document.getElementById(child + "UpperCrystals");

    lower.innerHTML = "";
    upper.innerHTML = "";

    const crystalCount =
    Math.min(displayPoints, 116);
    let gemIndex = 0;


    /*
       LOWER CHAMBER
    */

    let remaining = crystalCount;

    for (
        let row = 0;
        row < lowerRows.length && remaining > 0;
        row++
    ) {

        const numberInRow =
            Math.min(lowerRows[row].count, remaining);

        const spacing = 11;

        const totalWidth =
            (numberInRow - 1) * spacing;

        const startX =
    (154 - totalWidth) / 2 - 4;

        for (let i = 0; i < numberInRow; i++) {

            const crystal =
                document.createElement("div");

            crystal.className = "crystal";
            stylePermanentCrystal(child, crystal, gemIndex++);

            crystal.style.left =
                `${startX + i * spacing}px`;
            crystal.style.top =
                `${lowerRows[row].y + Number(crystal.dataset.jitter)}px`;

            lower.appendChild(crystal);
        }

remaining -= numberInRow;
    }


    /*
       UPPER CHAMBER

       Fills from the cinch upwards.
       Three crystals form the narrow neck.
    */

    let upperRemaining =
        Math.max(0, crystalCount - 45);

    const upperSpacing = 10;

    for (
        let row = 0;
        row < upperRows.length && upperRemaining > 0;
        row++
    ) {

        const numberInRow =
            Math.min(
                upperRows[row].count,
                upperRemaining
            );

        const totalWidth =
            (numberInRow - 1) * upperSpacing;

        const startX =
    (154 - totalWidth) / 2 - 4;

        for (let i = 0; i < numberInRow; i++) {

            const crystal =
                document.createElement("div");

            crystal.className =
                "crystal";
            stylePermanentCrystal(child, crystal, gemIndex++);

            crystal.style.left =
                `${startX + i * upperSpacing}px`;
            crystal.style.top =
                `${upperRows[row].y + Number(crystal.dataset.jitter)}px`;

            upper.appendChild(crystal);
        }

        upperRemaining -= numberInRow;
    }
}


function showFallingCrystal(child, currentPoints, onLanding) {

    const glass =
        document.getElementById(child + "Glass");

    const crystal =
        document.createElement("div");

    crystal.className =
        "falling-crystal sprite-falling";

    const spriteColour = child === "rhea" ? "ruby" : "emerald";
    const spriteVariant = 1 + Math.floor(Math.random() * 5);
    crystal.style.setProperty(
        "--gem-sprite",
        `url("assets/gems/${spriteColour}-${spriteVariant}.png")`
    );

    glass.appendChild(crystal);

    const drift =
        (Math.random() * 12) - 6;

    crystal.style.setProperty(
        "--fall-x",
        drift + "px"
    );

    let landingY;


    /* LOWER HALF */

    if (currentPoints < 45) {

        const lower = document.getElementById(child + "Crystals");
        let remaining = currentPoints;
        let targetY = lower.offsetTop + lowerRows[0].y;

        for (let i = 0; i < lowerRows.length; i++) {

            if (remaining < lowerRows[i].count) {
                targetY =
                    lower.offsetTop + lowerRows[i].y;
                break;
            }

            remaining -= lowerRows[i].count;
        }

        landingY = targetY - crystal.offsetTop;
    }


    /* CINCH / UPPER HALF */

    else {

        let upperCount =
            Math.min(currentPoints, 116) - 45;

        let remaining =
            upperCount;

        let targetY = 12;

        for (let i = 0; i < upperRows.length; i++) {

            if (remaining <= 0) {
                targetY =
                    8 + upperRows[i].y;
                break;
            }

            remaining -= upperRows[i].count;
        }

        if (upperCount >= 71) {
            targetY = 12;
        }

        landingY = targetY + 30 - crystal.offsetTop;
    }


    crystal.style.setProperty(
        "--fall-distance",
        landingY + "px"
    );

    const fallDuration =
        950 + Math.random() * 300;

  crystal.style.animationDuration =
    fallDuration + "ms";

    crystal.addEventListener("animationstart", () => {
        scheduleGemImpactSound(child, crystal, fallDuration);
    }, { once: true });

setTimeout(() => {

    crystal.remove();
    scheduledGemImpacts.delete(crystal);

    if (typeof onLanding === "function" && onLanding(spriteVariant) === false) return;

    const glass = document.getElementById(child + "Glass");

    glass.classList.remove("gem-land");

    // Force the browser to restart the animation
    void glass.offsetWidth;

    glass.classList.add("gem-land");

    setTimeout(() => {
        glass.classList.remove("gem-land");
    }, 220);

}, fallDuration);
}

async function fetchScores(signal) {
    const response = await fetch(
        `${SUPABASE_URL}/rest/v1/game_state?select=child,points,updated_at&child=in.(Rhea,Charlie)`,
        { headers: { apikey: SUPABASE_KEY }, signal }
    );
    if (!response.ok) throw new Error(`Score load failed (${response.status})`);
    return response.json();
}

function validScore(row) {
    return row && Number.isInteger(row.points) && row.points >= 0;
}

function applyRemoteScore(row) {
    const child = Object.keys(scoreRows).find(key => scoreRows[key] === row.child);
    if (!child || !validScore(row)) return;

    const timestamp = Date.parse(row.updated_at);
    if (scoreSaves[child].ownTimestamps.includes(timestamp)) return;
    const difference = row.points - points[child];
    if (difference !== 0) {
        tracePointsCupAudio("REMOTE SCORE CHANGE RECEIVED", child);
        changePoints(child, difference, "remote");
    }
}

function saveScore(child) {
    const save = scoreSaves[child];
    save.desired = points[child];
    if (save.active) return;
    save.active = true;

    (async () => {
        while (save.desired !== null) {
            const value = save.desired;
            save.desired = null;
            save.lastTimestamp = Math.max(Date.now(), save.lastTimestamp + 1);
            const timestamp = new Date(save.lastTimestamp).toISOString();
            save.ownTimestamps.push(save.lastTimestamp);
            if (save.ownTimestamps.length > 30) save.ownTimestamps.shift();

            try {
                const response = await fetch(
                    `${SUPABASE_URL}/rest/v1/game_state?child=eq.${scoreRows[child]}&select=child,points,updated_at`,
                    {
                        method: "PATCH",
                        headers: {
                            apikey: SUPABASE_KEY,
                            "Content-Type": "application/json",
                            Prefer: "return=representation"
                        },
                        body: JSON.stringify({ points: value, updated_at: timestamp })
                    }
                );
                if (!response.ok) throw new Error(`Score save failed (${response.status})`);
                const rows = await response.json();
                if (rows.length !== 1) throw new Error("Score save did not update a row");
            } catch (error) {
                console.error(error);
            }
        }
        save.active = false;
    })();
}

let realtimeSocket = null;
let realtimeHeartbeat = null;
let realtimeRetry = 1000;
let realtimeRef = 0;
let remoteEventCount = 0;

function connectRealtime() {
    const socketUrl = `${SUPABASE_URL.replace(/^http/, "ws")}/realtime/v1/websocket?apikey=${encodeURIComponent(SUPABASE_KEY)}`;
    const socket = new WebSocket(socketUrl);
    realtimeSocket = socket;

    socket.onopen = () => {
        realtimeRetry = 1000;
        socket.send(JSON.stringify({
            topic: "realtime:points-cup",
            event: "phx_join",
            payload: { config: {
                postgres_changes: [{ event: "UPDATE", schema: "public", table: "game_state" }],
                private: false
            } },
            ref: String(++realtimeRef),
            join_ref: "1"
        }));
        realtimeHeartbeat = setInterval(() => {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    topic: "phoenix", event: "heartbeat", payload: {},
                    ref: String(++realtimeRef), join_ref: null
                }));
            }
        }, 20000);
    };

    socket.onmessage = event => {
        const message = JSON.parse(event.data);
        if (message.event === "postgres_changes" &&
            message.payload?.data?.type === "UPDATE") {
            remoteEventCount++;
            applyRemoteScore(message.payload.data.record);
        } else if (message.event === "phx_reply" && message.payload?.status === "ok" &&
            message.topic === "realtime:points-cup") {
            const before = remoteEventCount;
            fetchScores().then(rows => {
                if (before === remoteEventCount) rows.forEach(applyRemoteScore);
            }).catch(error => console.error(error));
        } else if (message.event === "phx_error") {
            socket.close();
        }
    };

    socket.onerror = () => socket.close();
    socket.onclose = () => {
        clearInterval(realtimeHeartbeat);
        if (realtimeSocket === socket) {
            setTimeout(connectRealtime, realtimeRetry);
            realtimeRetry = Math.min(realtimeRetry * 2, 30000);
        }
    };
}

const startupFetch = new AbortController();
const startupTimeout = setTimeout(() => startupFetch.abort(), 8000);
fetchScores(startupFetch.signal).then(rows => {
    for (const child of Object.keys(scoreRows)) {
        const row = rows.find(item => item.child === scoreRows[child]);
        if (!validScore(row)) throw new Error(`Missing or invalid ${scoreRows[child]} score`);
        points[child] = row.points;
        pointQueues[child].launched = row.points;
        pointQueues[child].landed = row.points;
        updateDisplay(child, row.points);
    }
}).catch(error => console.error(error)).finally(() => {
    clearTimeout(startupTimeout);
    scoresLoaded = true;
    earlyPointChanges.splice(0).forEach(args => changePoints(...args));
    requestAnimationFrame(() => document.body.classList.remove("scores-loading"));
    connectRealtime();
});
ensureAudio();
Promise.all([gemSampleReady, thunderReady]).then(updateSoundControl);
